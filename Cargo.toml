[workspace]
members = [
    "crates/terminal-models",
    "crates/terminal-protocol",
    "crates/terminal-core",
    "gateway",
    "firmware",
]
default-members = [
    "crates/terminal-models",
    "crates/terminal-protocol",
    "crates/terminal-core",
    "gateway",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/esp32-lightning-terminal"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.9"
embedded-graphics = "0.8.2"
esp-idf-hal = "0.46.2"
esp-idf-svc = "0.52.1"
esp-idf-sys = "0.37.2"
hex = "0.4.3"
hmac = "0.12.1"
qrcodegen = "1.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = "0.5.3"
tower-http = "0.6.6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
