[package]
name = "lightning-terminal-firmware"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lightning-terminal-firmware"
path = "src/main.rs"
harness = false

[dependencies]
embedded-graphics.workspace = true
esp-idf-hal.workspace = true
esp-idf-svc.workspace = true
esp-idf-sys = { workspace = true, features = ["binstart"] }
log = "0.4.28"
qrcodegen.workspace = true
serde.workspace = true
terminal-core = { path = "../crates/terminal-core" }
terminal-models = { path = "../crates/terminal-models" }
terminal-protocol = { path = "../crates/terminal-protocol" }
thiserror.workspace = true

[build-dependencies]
embuild = "0.33.3"

[package.metadata.esp-idf-sys]
esp_idf_version = "tag:v5.5.4"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[lints]
workspace = true
