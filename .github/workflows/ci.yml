name: ci

on:
  push:
  pull_request:

jobs:
  rust-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude lightning-terminal-firmware --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude lightning-terminal-firmware
      - name: Gateway build
        run: cargo build -p lightning-terminal-gateway

  firmware-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Validate firmware manifest
        run: cargo metadata --manifest-path firmware/Cargo.toml --no-deps
